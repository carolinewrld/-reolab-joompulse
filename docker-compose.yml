services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: joompulse
      POSTGRES_PASSWORD: joompulse
      POSTGRES_DB: joompulse
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joompulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    ports:
      - "8000:8000"
    command: uvicorn joompulse.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src

  beat:
    build: .
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    command: celery -A joompulse.tasks.celery_app beat --loglevel=INFO
    volumes:
      - ./src:/app/src

  worker-fetch:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    command: celery -A joompulse.tasks.celery_app worker -Q fetch --loglevel=INFO --concurrency=2
    volumes:
      - ./src:/app/src

  worker-ai:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    command: celery -A joompulse.tasks.celery_app worker -Q ai --loglevel=INFO --concurrency=4
    volumes:
      - ./src:/app/src

  worker-notify:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    command: celery -A joompulse.tasks.celery_app worker -Q notify --loglevel=INFO --concurrency=2
    volumes:
      - ./src:/app/src

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    command: python -m joompulse.bot.main
    volumes:
      - ./src:/app/src
